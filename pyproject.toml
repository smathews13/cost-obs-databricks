[project]
name = "cost-observability-control"
version = "1.2.0"
description = "Cost Observability & Control - Databricks compute consumption and spend analytics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "databricks-sdk>=0.38.0",
    "databricks-sql-connector>=3.6.0,<4.0.0",
    "httpx>=0.27.0",
    "cachetools>=5.0.0,<6.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["server/tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"
filterwarnings = [
    "error::pytest.PytestUnhandledThreadExceptionWarning",
]
markers = [
    "external: contacts a live service and is opt-in",
    "integration: requires external infrastructure or credentials and is opt-in",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
